<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pharma Aesthetics | Pharmacist-Led Aesthetic Clinic</title>

<style>
:root{
  --cream:#fff8f7;
  --blush:#f7dfe5;
  --deep:#2b2524;
  --soft:#6f6461;
  --gold:#b68a66;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#fff8f7,#fbecef);
  color:var(--deep);
}

/* HEADER */
.header{
  position:fixed;
  width:100%;
  top:0;
  background:rgba(255,248,247,.9);
  padding:18px 0;
  text-align:center;
  z-index:1000;
  backdrop-filter:blur(10px);
}

.header a{
  margin:0 15px;
  font-size:13px;
  text-transform:uppercase;
}

/* HERO */
.hero{
  padding-top:120px;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-main-logo{
  width:390px;
  max-width:90%;
  display:block;
  margin:0 auto 30px;
}

h1{
  font-family:Georgia,serif;
  font-size:48px;
  margin-bottom:20px;
}

.hero p{
  max-width:600px;
  margin:0 auto 25px;
  color:var(--soft);
}

.btn{
  padding:12px 22px;
  border-radius:999px;
  margin:5px;
  font-size:13px;
  text-transform:uppercase;
}

.btn-gold{
  background:var(--gold);
  color:white;
}

.btn-outline{
  border:1px solid var(--gold);
  color:var(--gold);
}
</style>
</head>

<body>

<header class="header">
  <a href="#">About</a>
  <a href="#">Treatments</a>
  <a href="#">Contact</a>
</header>

<section class="hero">
  <div>

    <img src="logo.jpg" alt="Pharma Aesthetics Logo" class="hero-main-logo">

    <h1>Soft, refined, naturally radiant skin.</h1>

    <p>
      Advanced aesthetic treatments combining clinical knowledge with a luxury, personalised approach.
    </p>

    <div>
      <a class="btn btn-gold">Book Consultation</a>
      <a class="btn btn-outline">Explore Treatments</a>
    </div>

  </div>
</section>

</body>
</html>
